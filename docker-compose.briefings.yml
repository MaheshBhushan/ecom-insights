services:
  briefing-api:
    build:
      context: .
      dockerfile: Dockerfile.briefings
    restart: unless-stopped
    environment:
      BRIEFING_API_TOKEN: ${BRIEFING_API_TOKEN:?Set BRIEFING_API_TOKEN}
      SALES_BRIEFING_WEBHOOK_URL: ${SALES_BRIEFING_WEBHOOK_URL:-}
      MARKETING_BRIEFING_WEBHOOK_URL: ${MARKETING_BRIEFING_WEBHOOK_URL:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./reports:/app/reports:ro
      - briefing_deliveries:/state
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: Europe/Berlin
      GENERIC_TIMEZONE: Europe/Berlin
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
    volumes:
      - briefing_n8n:/home/node/.n8n
      - ./n8n:/workflows:ro
    depends_on:
      - briefing-api
volumes:
  briefing_deliveries:
  briefing_n8n:
